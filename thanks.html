<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | Northfork Auto &amp; Tire</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{--bg:#2F3F4D;--ink:#E9EEF2;--soft:#A9B6C1;--red:#C9372A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.6;padding:40px 20px;border-top:6px solid var(--red)}
main{max-width:34rem}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:600;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0}
h1{font-family:"Big Shoulders Display","Arial Narrow",Arial,sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(2.4rem,7vw,3.6rem);line-height:.98;margin:12px 0 16px}
p{color:var(--soft);margin:0 0 14px}
a.btn{display:inline-block;margin-top:14px;background:var(--red);color:#fff;font-weight:700;padding:12px 20px;border-radius:4px;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Request received</p>
  <h1>Got it. We'll call to confirm your time.</h1>
  <p>Your appointment request is on its way to the shop. Expect a call or text from (814) 555-0187, usually the same business day.</p>
  <p>This is a demo site for a fictional shop, so no one will actually call.</p>
  <a class="btn" href="/">Back to the site</a>
</main>
</body>
</html>
